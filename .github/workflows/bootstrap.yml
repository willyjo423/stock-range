name: Bootstrap

# Downloads the universe, measures what each feature group is worth, runs the
# walk-forward evaluation and trains one model per horizon.
#
# Start with the default sample. A thousand tickers over twenty years is
# millions of rows, and it is worth seeing the shape of the answer on a quarter
# of it before spending an hour on all of it.
on:
  workflow_dispatch:
    inputs:
      full:
        description: "Use every index member ever (~1000 names, 3-5 hrs)"
        type: boolean
        required: false
        default: false
      sample:
        # This MUST default to empty. GitHub substitutes an input's default
        # whenever the submitted value is blank, so a default of "250" makes
        # the full universe unreachable through this form - clearing the box
        # sends 250 back. Two runs were spent discovering that. The `full`
        # toggle above is the belt to that braces: it overrides whatever is
        # here.
        description: "Or a sample size (e.g. 250 for a fast look)"
        required: false
        default: ""
      horizons:
        description: "Trading-day horizons, space separated (blank = 5 21 63)"
        required: false
        default: ""
      earnings:
        description: "Fetch earnings dates (slow the first time, then cached)"
        type: boolean
        required: false
        default: true
      ablation:
        description: "Measure each feature group (slower, but it is the point)"
        type: boolean
        required: false
        default: true
      ablation_horizon:
        description: "Ablate only this horizon (21 = one month, 0 = all three)"
        required: false
        default: "21"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Offline checks
        # No network. If these fail the fault is in the code, not the market.
        run: |
          python test_data.py
          python test_model.py

      # Prices and earnings both cache to disk and neither changes for a
      # finished day, so this turns a long download into seconds on a rerun.
      - name: Restore data cache
        uses: actions/cache@v4
        with:
          path: data/cache
          key: vol-cache-${{ github.run_id }}
          restore-keys: |
            vol-cache-
            prices-

      - name: Build
        run: |
          ARGS=""
          if [ "${{ inputs.full }}" != "true" ] && [ -n "${{ inputs.sample }}" ]; then
            ARGS="$ARGS --sample ${{ inputs.sample }}"
          fi
          echo "EFFECTIVE UNIVERSE: $( [ "${{ inputs.full }}" = "true" ] && echo "FULL (every index member ever)" || echo "sample=${{ inputs.sample }}" )"
          if [ -n "${{ inputs.horizons }}" ]; then ARGS="$ARGS --horizons ${{ inputs.horizons }}"; fi
          if [ "${{ inputs.earnings }}" = "false" ]; then ARGS="$ARGS --no-earnings"; fi
          if [ "${{ inputs.ablation }}" = "false" ]; then ARGS="$ARGS --no-ablation"; fi
          if [ -n "${{ inputs.ablation_horizon }}" ]; then ARGS="$ARGS --ablation-horizon ${{ inputs.ablation_horizon }}"; fi
          echo "build.py $ARGS"
          python build.py $ARGS | tee bootstrap.txt

      - name: Keep the models and the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-output
          path: |
            bootstrap.txt
            data/metrics.json
            models/
          retention-days: 30

      - name: Commit the trained models
        # `always()` because build.py writes each horizon's model to disk as
        # that horizon finishes. If the job is cancelled or times out during
        # the last one, the earlier models are complete and sitting there -
        # committing them costs nothing and saves the whole run from being
        # thrown away over the horizon that did not finish.
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f models/ data/metrics.json
          git diff --staged --quiet && echo "nothing changed" && exit 0
          git commit -m "Bootstrap: retrain range models"
          git pull --rebase --autostash origin main || true
          git push
